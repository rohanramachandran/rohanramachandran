<svg xmlns="http://www.w3.org/2000/svg" width="920" height="516" viewBox="0 0 920 516" role="img" aria-label="Rohan Ramachandran — CS undergraduate at Columbia, working on physical AI and ML systems for decision-making.">
  <style>
    .mono  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Charter, "Bitstream Charter", Cambria, Georgia, serif; }
  </style>
  <rect x="0.5" y="0.5" width="919" height="515" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1"/>

  <text x="44" y="76" class="mono" font-size="31" font-weight="700" letter-spacing="-0.5" fill="#e7e6e2">Rohan Ramachandran</text>

  <text x="44" y="120" class="serif" font-size="17" fill="#d2d1cd">CS undergraduate at Columbia, working on physical AI and ML systems for</text>
  <text x="44" y="144" class="serif" font-size="17" fill="#d2d1cd">decision-making: on-device architectures, safety instrumentation for</text>
  <text x="44" y="168" class="serif" font-size="17" fill="#d2d1cd">deployed systems, and graph systems for relational reasoning.</text>

  <text x="44" y="200" class="serif" font-size="17" fill="#8a8a8a">Robots, wearables, and drones should reason about their world on a battery.</text>

  <line x1="44" y1="234" x2="876" y2="234" stroke="#2a2a2a" stroke-width="1"/>

  <text x="44" y="266" class="mono" font-size="13" font-weight="600" letter-spacing="3" fill="#888888">Current work</text>

  <rect x="44" y="290" width="5" height="5" fill="#9fb6c9"/>
  <text x="62" y="298" class="serif" font-size="16" fill="#b3b2ae"><tspan class="mono" font-size="15" font-weight="600" fill="#d6e2ec">Air Force Research Laboratory</tspan> — on-device architectures for few-shot autonomous</text>
  <text x="62" y="320" class="serif" font-size="16" fill="#b3b2ae">visual reasoning (Information and Spectrum Warfare Directorate)</text>

  <rect x="44" y="344" width="5" height="5" fill="#9fb6c9"/>
  <text x="62" y="352" class="serif" font-size="16" fill="#b3b2ae"><tspan class="mono" font-size="15" font-weight="600" fill="#d6e2ec">SpineSync</tspan> — radiation-free Parkinson's tracking wearable, sensing and inference</text>
  <text x="62" y="374" class="serif" font-size="16" fill="#b3b2ae">on the device (IEEE 2025, provisional patent)</text>

  <rect x="44" y="398" width="5" height="5" fill="#9fb6c9"/>
  <text x="62" y="406" class="serif" font-size="16" fill="#b3b2ae"><tspan class="mono" font-size="15" font-weight="600" fill="#d6e2ec">Boundary-Adjacent Benign Evaluation (BABE)</tspan> — a benchmark for auditing LLM safety</text>
  <text x="62" y="428" class="serif" font-size="16" fill="#b3b2ae">interventions (Columbia Software Systems Lab, in preparation)</text>

  <rect x="44" y="452" width="5" height="5" fill="#9fb6c9"/>
  <text x="62" y="460" class="serif" font-size="16" fill="#b3b2ae"><tspan class="mono" font-size="15" font-weight="600" fill="#d6e2ec">concept-atlas</tspan> — causal concept graphs read out of transformer internals: probes,</text>
  <text x="62" y="482" class="serif" font-size="16" fill="#b3b2ae">activation patching, D3</text>
</svg>
